[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geelark-cluster-master-admin"
version = "0.1.0"
description = "API administrativa local de solo lectura para PC-MASTER"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "geelark-cluster-persistence", "psycopg[binary]>=3.2,<4", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "fastapi==0.143.0", "starlette==1.7.0", "httpx2==2.13.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
geelark_master_admin = ["panel.html"]
