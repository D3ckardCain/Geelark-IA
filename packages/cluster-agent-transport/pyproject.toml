[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geelark-cluster-agent-transport"
version = "0.1.0"
description = "Transporte HTTPS privado y autorización por operación para agentes GeeLark-IA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
geelark-agent = "cluster_agent_transport.supervisor:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
