name: Cluster persistence prototype

on:
  pull_request:
    paths:
      - "packages/cluster-persistence/prototype/**"
      - ".github/workflows/cluster-persistence-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cluster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cluster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply prototype schema to disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: cluster_test
        run: psql -v ON_ERROR_STOP=1 -f packages/cluster-persistence/prototype/001_schema.sql
      - name: Apply transactional assignment function
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: cluster_test
        run: psql -v ON_ERROR_STOP=1 -f packages/cluster-persistence/prototype/002_assign_instance.sql
      - name: Test core database constraints
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: cluster_test
        run: psql -v ON_ERROR_STOP=1 -f packages/cluster-persistence/prototype/test_constraints.sql
      - name: Test transactional assignment and idempotency
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: cluster_test
        run: psql -v ON_ERROR_STOP=1 -f packages/cluster-persistence/prototype/test_assignment_function.sql
      - name: Test concurrent active reservation exclusion
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: cluster_test
        run: bash packages/cluster-persistence/prototype/test_concurrency.sh
      - name: Test concurrent complete assignments
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: cluster_test
        run: bash packages/cluster-persistence/prototype/test_concurrent_assignments.sh
