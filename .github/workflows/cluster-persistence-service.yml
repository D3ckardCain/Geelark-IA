name: Cluster persistence service

on:
  pull_request:
    paths:
      - "db/**"
      - "packages/cluster-persistence/**"
      - ".github/workflows/cluster-persistence-service.yml"
  push:
    branches: [main]
    paths:
      - "db/**"
      - "packages/cluster-persistence/**"
      - ".github/workflows/cluster-persistence-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Python 3.11 — PostgreSQL assignment service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geelark_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geelark_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/geelark_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply schema migration to disposable database
        shell: bash
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec -i "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 < db/migrations/0001_cluster_control.sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/cluster-persistence/pyproject.toml

      - name: Install persistence package and tests
        run: python -m pip install -e "packages/cluster-persistence[test]"

      - name: Run persistence integration and concurrency tests
        run: python -m pytest packages/cluster-persistence/tests -q

      - name: Check dependency consistency
        run: python -m pip check
