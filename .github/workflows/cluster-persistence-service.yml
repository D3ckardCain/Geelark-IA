name: Cluster persistence service

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "db/**"
      - "packages/cluster-persistence/**"
      - "packages/cluster-agent-guard/**"
      - "packages/cluster-agent-auth/**"
      - "packages/cluster-agent-transport/**"
      - "packages/cluster-master-admin/**"
      - "pytest.ini"
      - ".github/workflows/cluster-persistence-service.yml"
  push:
    branches: [main]
    paths:
      - "db/**"
      - "packages/cluster-persistence/**"
      - "packages/cluster-agent-guard/**"
      - "packages/cluster-agent-auth/**"
      - "packages/cluster-agent-transport/**"
      - "packages/cluster-master-admin/**"
      - "pytest.ini"
      - ".github/workflows/cluster-persistence-service.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation for a given PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Python 3.11 — PostgreSQL assignment service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geelark_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geelark_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/geelark_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply schema migrations to disposable database
        if: hashFiles('db/migrations/*.sql') != ''
        shell: bash
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          for migration in db/migrations/*.sql; do
            test -f "$migration" || continue
            docker exec -i "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install persistence package and tests
        if: hashFiles('packages/cluster-persistence/pyproject.toml') != ''
        run: python -m pip install -e "packages/cluster-persistence[test]"

      - name: Run persistence integration and concurrency tests
        if: hashFiles('packages/cluster-persistence/pyproject.toml') != ''
        run: python -m pytest packages/cluster-persistence/tests -q

      - name: Install agent guard and tests when present
        if: hashFiles('packages/cluster-agent-guard/pyproject.toml') != ''
        run: python -m pip install -e "packages/cluster-agent-guard[test]"

      - name: Run agent guard tests when present
        if: hashFiles('packages/cluster-agent-guard/pyproject.toml') != ''
        run: python -m pytest packages/cluster-agent-guard/tests -q

      - name: Install agent auth service and tests when present
        if: hashFiles('packages/cluster-agent-auth/pyproject.toml') != ''
        run: python -m pip install -e "packages/cluster-agent-auth[test]"

      - name: Run agent auth service tests when present
        if: hashFiles('packages/cluster-agent-auth/pyproject.toml') != ''
        run: python -m pytest packages/cluster-agent-auth/tests -q

      - name: Install Master Admin API and tests when present
        if: hashFiles('packages/cluster-master-admin/pyproject.toml') != ''
        run: python -m pip install -e "packages/cluster-master-admin[test]"

      - name: Run Master Admin API security tests when present
        if: hashFiles('packages/cluster-master-admin/pyproject.toml') != ''
        run: python -m pytest packages/cluster-master-admin/tests -q

      - name: Verify PostgreSQL read-only role when present
        if: hashFiles('packages/cluster-master-admin/sql/MASTER_ADMIN_READONLY_ROLE.sql') != ''
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=postgres:16-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          # Exercise migration of an existing role whose LOGIN attribute is disabled.
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "CREATE ROLE geelark_master_reader NOLOGIN"
          docker exec -i "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 < packages/cluster-master-admin/sql/MASTER_ADMIN_READONLY_ROLE.sql
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "ALTER ROLE geelark_master_reader PASSWORD 'test-only-password'"
          reader_dsn="postgresql://geelark_master_reader:test-only-password@127.0.0.1:5432/geelark_test"
          PGPASSWORD=test-only-password psql "$reader_dsn" -v ON_ERROR_STOP=1 -f packages/cluster-master-admin/sql/verify_readonly_role.sql

          # Negative test: a grant on any other application table must be rejected.
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "CREATE TABLE public.geelark_admin_privilege_probe(id integer); GRANT SELECT ON public.geelark_admin_privilege_probe TO geelark_master_reader"
          if PGPASSWORD=test-only-password psql "$reader_dsn" -v ON_ERROR_STOP=1 -f packages/cluster-master-admin/sql/verify_readonly_role.sql > /tmp/geelark-admin-privilege-probe.log 2>&1; then
            echo "ERROR: el verificador aceptó SELECT sobre una tabla ajena"
            exit 1
          fi
          grep -q "privilegios efectivos sobre un objeto distinto" /tmp/geelark-admin-privilege-probe.log || { cat /tmp/geelark-admin-privilege-probe.log; exit 1; }
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "REVOKE SELECT ON public.geelark_admin_privilege_probe FROM geelark_master_reader; DROP TABLE public.geelark_admin_privilege_probe"

          # Negative test: PUBLIC EXECUTE on a SECURITY DEFINER routine must be rejected.
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "CREATE FUNCTION public.geelark_admin_function_probe() RETURNS integer LANGUAGE sql SECURITY DEFINER AS 'SELECT 1'"
          if PGPASSWORD=test-only-password psql "$reader_dsn" -v ON_ERROR_STOP=1 -f packages/cluster-master-admin/sql/verify_readonly_role.sql > /tmp/geelark-admin-function-probe.log 2>&1; then
            echo "ERROR: el verificador aceptó EXECUTE sobre una rutina ajena"
            exit 1
          fi
          grep -q "EXECUTE sobre una rutina no permitida" /tmp/geelark-admin-function-probe.log || { cat /tmp/geelark-admin-function-probe.log; exit 1; }
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "DROP FUNCTION public.geelark_admin_function_probe()"

          # Negative test: column-level SELECT on an unrelated table must be rejected.
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "CREATE TABLE public.geelark_admin_column_probe(secret text); GRANT SELECT(secret) ON public.geelark_admin_column_probe TO geelark_master_reader"
          if PGPASSWORD=test-only-password psql "$reader_dsn" -v ON_ERROR_STOP=1 -f packages/cluster-master-admin/sql/verify_readonly_role.sql > /tmp/geelark-admin-column-probe.log 2>&1; then
            echo "ERROR: el verificador aceptó SELECT de columna en una tabla ajena"
            exit 1
          fi
          grep -q "privilegios efectivos sobre un objeto distinto" /tmp/geelark-admin-column-probe.log || { cat /tmp/geelark-admin-column-probe.log; exit 1; }
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "REVOKE SELECT(secret) ON public.geelark_admin_column_probe FROM geelark_master_reader; DROP TABLE public.geelark_admin_column_probe"

          # Negative test: column-level UPDATE on the allowed nodes table must be rejected.
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "GRANT UPDATE(display_name) ON geelark_control.nodes TO geelark_master_reader"
          if PGPASSWORD=test-only-password psql "$reader_dsn" -v ON_ERROR_STOP=1 -f packages/cluster-master-admin/sql/verify_readonly_role.sql > /tmp/geelark-admin-node-column-write.log 2>&1; then
            echo "ERROR: el verificador aceptó UPDATE de columna en nodes"
            exit 1
          fi
          grep -q "privilegios de escritura o DDL sobre nodes" /tmp/geelark-admin-node-column-write.log || { cat /tmp/geelark-admin-node-column-write.log; exit 1; }
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "REVOKE UPDATE(display_name) ON geelark_control.nodes FROM geelark_master_reader"

          # Negative test: ownership/CREATE on an unrelated schema must be rejected.
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "CREATE SCHEMA geelark_admin_owner_probe AUTHORIZATION geelark_master_reader"
          if PGPASSWORD=test-only-password psql "$reader_dsn" -v ON_ERROR_STOP=1 -f packages/cluster-master-admin/sql/verify_readonly_role.sql > /tmp/geelark-admin-owner-probe.log 2>&1; then
            echo "ERROR: el verificador aceptó propiedad/CREATE en otro esquema"
            exit 1
          fi
          grep -q "CREATE sobre un esquema no permitido" /tmp/geelark-admin-owner-probe.log || { cat /tmp/geelark-admin-owner-probe.log; exit 1; }
          docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "DROP SCHEMA geelark_admin_owner_probe"

          # Negative tests: each role-level session safeguard must be independently enforced.
          for setting in default_transaction_read_only statement_timeout lock_timeout idle_in_transaction_session_timeout; do
            case "$setting" in
              default_transaction_read_only) bad_value="off"; good_value="on"; expected="default_transaction_read_only debe ser on" ;;
              statement_timeout) bad_value="0"; good_value="1500ms"; expected="statement_timeout debe ser 1500ms" ;;
              lock_timeout) bad_value="0"; good_value="500ms"; expected="lock_timeout debe ser 500ms" ;;
              idle_in_transaction_session_timeout) bad_value="0"; good_value="5000ms"; expected="idle_in_transaction_session_timeout debe ser 5s" ;;
            esac
            docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "ALTER ROLE geelark_master_reader SET $setting = '$bad_value'"
            if PGPASSWORD=test-only-password psql "$reader_dsn" -v ON_ERROR_STOP=1 -f packages/cluster-master-admin/sql/verify_readonly_role.sql > "/tmp/geelark-admin-setting-$setting.log" 2>&1; then
              echo "ERROR: el verificador aceptó $setting=$bad_value"
              exit 1
            fi
            grep -Fq "$expected" "/tmp/geelark-admin-setting-$setting.log" || { cat "/tmp/geelark-admin-setting-$setting.log"; exit 1; }
            docker exec "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 -c "ALTER ROLE geelark_master_reader SET $setting = '$good_value'"
          done

      - name: Install agent transport and tests when present
        if: hashFiles('packages/cluster-agent-transport/pyproject.toml') != ''
        run: python -m pip install -e "packages/cluster-agent-transport[test]"

      - name: Run task inbox PostgreSQL integration tests when present
        if: hashFiles('packages/cluster-agent-transport/tests/test_task_inbox_postgres.py') != ''
        run: python -m pytest packages/cluster-agent-transport/tests/test_task_inbox_postgres.py -q

      - name: Check dependency consistency
        if: hashFiles('packages/cluster-persistence/pyproject.toml') != '' || hashFiles('packages/cluster-agent-guard/pyproject.toml') != '' || hashFiles('packages/cluster-agent-auth/pyproject.toml') != '' || hashFiles('packages/cluster-master-admin/pyproject.toml') != ''
        run: python -m pip check


  windows-acl:
    if: github.event_name == 'pull_request'
    name: Windows runner — ACL NTFS de PC-MASTER
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install persistence package
        run: python -m pip install -e packages/cluster-persistence

      - name: Install Master Admin and test dependencies
        run: python -m pip install -e "packages/cluster-master-admin[test]"

      - name: Run Master Admin auth and runtime tests on real Windows ACLs
        run: python -m pytest packages/cluster-master-admin/tests/test_auth.py packages/cluster-master-admin/tests/test_runtime.py -q

      - name: Check dependency consistency
        run: python -m pip check


  root-suite:
    # Validación integral desde la raíz para la PR de reconciliación del panel.
    if: github.event_name == 'pull_request' && (github.event.pull_request.number == 104 || github.head_ref == 'feat/pc-master-task-inbox-reconciliation-v1')
    name: Python 3.11 — suite completa desde la raíz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geelark_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geelark_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/geelark_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply schema migrations to disposable database
        if: hashFiles('db/migrations/*.sql') != ''
        shell: bash
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          for migration in db/migrations/*.sql; do
            test -f "$migration" || continue
            docker exec -i "$container_id" psql -U postgres -d geelark_test -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install all package test dependencies
        run: |
          python -m pip install -e "packages/cluster-persistence[test]" -e "packages/cluster-agent-guard[test]" -e "packages/cluster-agent-auth[test]" -e "packages/cluster-agent-transport[test]" -e "packages/cluster-master-admin[test]"

      - name: Run full repository test suite from root
        run: python -m pytest -vv -o faulthandler_timeout=30

      - name: Check dependency consistency
        run: python -m pip check
