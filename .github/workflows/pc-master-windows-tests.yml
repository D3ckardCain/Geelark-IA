name: PC-MASTER Windows tests

on:
  pull_request:
    paths:
      - "packages/cluster-master-admin/**"
      - "packages/cluster-persistence/**"
      - ".github/workflows/pc-master-windows-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-master-windows-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows 11 runner — PC-MASTER admin tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/cluster-persistence/pyproject.toml
            packages/cluster-master-admin/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install "pytest-timeout>=2.3,<3" -e "packages/cluster-persistence[test]" -e "packages/cluster-master-admin[test]"

      - name: Run PC-MASTER tests on Windows with diagnostics
        run: python -m pytest packages/cluster-master-admin/tests -vv --timeout=60 --durations=20

      - name: Check dependency consistency
        if: always()
        run: python -m pip check
