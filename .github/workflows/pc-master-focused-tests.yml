name: PC-MASTER focused tests

on:
  pull_request:
    paths:
      - "packages/cluster-master-admin/**"
      - "packages/cluster-persistence/**"
      - ".github/workflows/pc-master-focused-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-master-focused-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  master-admin:
    name: Python 3.11 — PC-MASTER admin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/cluster-persistence/pyproject.toml
            packages/cluster-master-admin/pyproject.toml

      - name: Install only required packages and test dependencies
        run: python -m pip install -e "packages/cluster-persistence[test]" -e "packages/cluster-master-admin[test]"

      - name: Run PC-MASTER tests with per-test diagnostics
        run: python -m pytest packages/cluster-master-admin/tests -vv -o faulthandler_timeout=30 --durations=20

      - name: Check dependency consistency
        if: always()
        run: python -m pip check
