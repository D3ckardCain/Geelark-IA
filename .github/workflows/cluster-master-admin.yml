name: Cluster Master Admin API

# Manual only: evitar consumo automático de minutos de Actions en un repositorio privado.
# Ejecutar únicamente tras revisar la cuota disponible y confirmar que no habrá cargos.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-api:
    name: Python 3.11 — API administrativa local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install persistence and admin packages with tests
        run: |
          python -m pip install -e "packages/cluster-persistence[test]"
          python -m pip install -e "packages/cluster-master-admin[test]"
      - name: Run admin API security tests
        run: python -m pytest packages/cluster-master-admin/tests -q
      - name: Check dependency consistency
        run: python -m pip check
