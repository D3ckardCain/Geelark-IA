name: Cluster contracts

on:
  pull_request:
    paths:
      - "packages/cluster-contracts/**"
      - ".github/workflows/cluster-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "packages/cluster-contracts/**"
      - ".github/workflows/cluster-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} — contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/cluster-contracts/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e "packages/cluster-contracts[test]"

      - name: Run contract tests
        run: python -m pytest packages/cluster-contracts/tests -q

      - name: Check dependency consistency
        run: python -m pip check
